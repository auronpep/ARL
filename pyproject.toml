[project]
name = "arl"
version = "0.1.0"
description = "Private Con Law MBE mechanics autoresearch pilot"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.25.0",
  "pydantic>=2.12.0",
  "ruamel.yaml>=0.18.16",
]

[dependency-groups]
dev = [
  "pytest>=9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
